<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLL Sandbox</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0e1116;
      color: #e8eef5;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #canvasWrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #scene {
      width: min(100vw, 177.78vh);
      height: min(100vh, 56.25vw);
      display: block;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 10px 14px;
      background: rgba(12, 16, 22, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.2px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    #hud b { color: #7fd1ff; font-weight: 600; }
    #hud .title { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: #fff; }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #9fb0c3;
      background: #0e1116;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    kbd {
      display: inline-block;
      min-width: 18px;
      padding: 1px 5px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
    }

    /* ---- Voice session HUD (bottom-center bar + subtitle) ---- */
    #voiceBar {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: min(90vw, 720px);
      pointer-events: none;
    }
    /* Subtitle line, centered just above the controls. Hidden when blank. */
    #subtitle {
      max-width: 100%;
      padding: 7px 14px;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      color: #f3f7fb;
      background: rgba(12, 16, 22, 0.66);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }
    #subtitle.empty { display: none; }
    /* Controls row: agent-state pill + Connect/Disconnect + status text. */
    #voiceControls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 14px;
      background: rgba(12, 16, 22, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }
    #agentState {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #c6d3e0;
      white-space: nowrap;
    }
    /* Leading status dot, recolored per agent state via the data-state attribute. */
    #agentState::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #6b7785;
    }
    #agentState[data-state="listening"] { color: #57d98a; }
    #agentState[data-state="listening"]::before { background: #57d98a; box-shadow: 0 0 7px #57d98a; }
    #agentState[data-state="thinking"] { color: #f0b541; }
    #agentState[data-state="thinking"]::before { background: #f0b541; box-shadow: 0 0 7px #f0b541; }
    #agentState[data-state="speaking"] { color: #5aa9ff; }
    #agentState[data-state="speaking"]::before { background: #5aa9ff; box-shadow: 0 0 7px #5aa9ff; }
    #connectBtn {
      padding: 6px 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #06121f;
      background: #7fd1ff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    #connectBtn:hover:not(:disabled) { background: #a3e0ff; }
    #connectBtn:disabled { cursor: default; opacity: 0.5; }
    #connectBtn[data-phase="connected"] { color: #fff; background: rgba(255, 90, 90, 0.85); }
    #connectBtn[data-phase="connected"]:hover:not(:disabled) { background: rgba(255, 120, 120, 0.95); }
    #voiceStatus {
      font-size: 11.5px;
      color: #f0b541;
      max-width: 280px;
    }
    #voiceStatus.empty { display: none; }
  </style>
</head>
<body>
  <div id="canvasWrap">
    <canvas id="scene" width="960" height="540"></canvas>
  </div>

  <div id="hud">
    <div class="title">LLL Sandbox</div>
    <div>Drive: <kbd>W</kbd> &nbsp; Pivot: <kbd>A</kbd><kbd>D</kbd> &nbsp; Stop: <kbd>S</kbd> &nbsp; Run: <kbd>Shift</kbd></div>
    <div>Status: <b id="status">booting…</b></div>
  </div>

  <div id="voiceBar">
    <div id="subtitle" class="empty"></div>
    <div id="voiceControls">
      <span id="agentState" data-state="disconnected">Disconnected</span>
      <button id="connectBtn" type="button" data-phase="idle">Connect</button>
      <span id="voiceStatus" class="empty"></span>
    </div>
  </div>

  <div id="loading">Loading sandbox…</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
